name: Build LaTeX

on:
  push:
    paths:
      - "C_-algebras.tex"
      - ".github/workflows/build-latex.yml"
  pull_request:
    paths:
      - "C_-algebras.tex"
      - ".github/workflows/build-latex.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latex-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compile book
        uses: xu-cheng/latex-action@v4
        with:
          root_file: C_-algebras.tex
          os: debian

      - name: Commit updated PDF
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C_-algebras.pdf
          if git diff --cached --quiet; then
            echo "The compiled PDF is already up to date."
          else
            git commit -m "Build updated book PDF [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v6
        with:
          name: C-star-algebras-PDF
          path: C_-algebras.pdf
          if-no-files-found: error
